
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AttendPro - Karyawan</title>
  <link rel="stylesheet" href="style.css">

  <style>
    video {
      width: 100%;
      max-width: 350px;
      border-radius: 12px;
      background: #222;
    }

    #faceCanvas {
      display: none;
    }

    .face-section,
    .history-section {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .face-section button,
    .history-section button {
      margin: 5px 0;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }

    .history-table th,
    .history-table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    .history-table th {
      background: #f2f2f2;
    }

    .history-wrapper {
      overflow-x: auto;
    }
  </style>
</head>

<body>

  <h1>AttendPro</h1>
  <p>Employee Dashboard</p>

  <h2>Dashboard Karyawan</h2>

  <section>

    <h3>Profil Karyawan</h3>

    <p id="employeeName">Memuat profil...</p>

    <form id="profileForm">

      <input
        type="text"
        id="nama"
        placeholder="Nama lengkap"
        required
      >

      <input
        type="text"
        id="nomorPaspor"
        placeholder="Nomor paspor"
        required
      >

      <button type="submit">Simpan Profil</button>

    </form>

    <div class="face-section">

      <h3>Verifikasi Wajah</h3>

      <p id="faceMessage">
        Silakan lakukan verifikasi wajah.
      </p>

      <p id="faceStatus">
        Status: Memuat...
      </p>

      <label>
        <input type="checkbox" id="faceConsent">
        Saya menyetujui pengambilan dan pemeriksaan
        foto untuk verifikasi karyawan.
      </label>

      <br><br>

      <video
        id="faceCamera"
        autoplay
        playsinline
        style="display:none;"
      ></video>

      <canvas id="faceCanvas"></canvas>

      <br>

      <img
        id="facePreview"
        alt="Pratinjau foto verifikasi"
        style="display:none;width:100%;max-width:350px;border-radius:12px;"
      >

      <br>

      <button type="button" id="startCameraButton">
        Buka Kamera
      </button>

      <button
        type="button"
        id="captureFaceButton"
        disabled
      >
        Ambil Foto
      </button>

      <button
        type="button"
        id="submitFaceButton"
        disabled
      >
        Kirim Verifikasi
      </button>

      <button
        type="button"
        id="stopCameraButton"
        disabled
      >
        Matikan Kamera
      </button>

    </div>

    <h3>Absensi</h3>

    <button id="checkInButton" disabled>
      Absen Masuk
    </button>

    <button id="checkOutButton" disabled>
      Absen Pulang
    </button>

    <div class="history-section">

      <h3>Riwayat Absensi</h3>

      <p>
        Lihat catatan kehadiran dan jam kerja kamu.
      </p>

      <button
        type="button"
        onclick="lihatRiwayatAbsensi()"
      >
        Lihat Riwayat
      </button>

      <div id="riwayatAbsensiContainer">
        <p>Klik tombol untuk melihat riwayat absensi.</p>
      </div>

    </div>

    <br>

    <button onclick="logout()">
      Keluar
    </button>

  </section>

  <p id="employeeMessage"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="karyawan.js"></script>

</body>
</html>
