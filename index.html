<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AttendPro - Login</title>
</head>
<body>

  <h1>AttendPro</h1>
  <p>Sistem Absensi Karyawan</p>

  <h2>Login</h2>

  <form id="loginForm">

    <br><br>

    <button type="submit">Masuk</button>
  </form>

  <p id="message"></p>

</body>
</html>
