
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - AttendPro</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="admin-page">

  <header>
    <h1>AttendPro</h1>
    <p id="adminMessage">Memuat dashboard...</p>
    <button onclick="logout()">Logout</button>
  </header>

  <main>

    <section>
      <h2>Dashboard Admin</h2>
      <p>Selamat datang di halaman administrator AttendPro.</p>
    </section>

    <section>
      <h2>Daftarkan Karyawan Baru</h2>

      <form id="tambahKaryawanForm">
        <label for="namaKaryawan">Nama Karyawan</label>
        <input
          type="text"
          id="namaKaryawan"
          placeholder="Masukkan nama karyawan"
          required
        >

        <label for="emailKaryawan">Email Karyawan</label>
        <input
          type="email"
          id="emailKaryawan"
          placeholder="Masukkan email karyawan"
          required
        >

        <button type="submit">Daftarkan Karyawan</button>
      </form>

      <p id="tambahKaryawanMessage"></p>
    </section>

    <section>
      <h2>Lokasi Kantor</h2>
      <p>Atur lokasi kantor untuk keperluan absensi GPS.</p>

      <button onclick="ambilLokasiKantor()">
        Simpan Lokasi Kantor
      </button>

      <p id="lokasiMessage"></p>
    </section>

    <section>
      <h2>Data Karyawan</h2>

      <button onclick="lihatDataKaryawan()">
        Tampilkan Data Karyawan
      </button>

      <div id="dataKaryawanContainer"></div>
    </section>

    <section>
      <h2>Data Absensi</h2>

      <button onclick="lihatDataAbsensi()">
        Tampilkan Data Absensi
      </button>

      <div id="dataAbsensiContainer"></div>
    </section>

    <section>
      <h2>Laporan</h2>
      <p>Fitur laporan akan ditambahkan berikutnya.</p>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="admin.js"></script>

</body>
</html>
