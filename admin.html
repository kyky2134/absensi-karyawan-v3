

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AttendPro - Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page">

  <h1>AttendPro</h1>
  <p>Administrator Dashboard</p>

  <h2>Dashboard Admin</h2>

  <section>
    <h3>Menu Administrator</h3>
    <h3>Daftarkan Karyawan Baru</h3>

<form id="tambahKaryawanForm">
  <input type="text" id="namaKaryawan"
    placeholder="Nama lengkap karyawan" required>

  <input type="email" id="emailKaryawan"
    placeholder="Email karyawan" required>

  <button type="submit">Daftarkan Karyawan</button>
</form>

<p id="tambahKaryawanMessage"></p>
    <button onclick="alert('Menu Data Karyawan')">Data Karyawan</button>
    <button onclick="alert('Menu Data Absensi')">Data Absensi</button>
    <button onclick="ambilLokasiKantor()">Ambil Lokasi Kantor</button>
    <p id="lokasiMessage"></p>
    <button onclick="alert('Menu Laporan')">Laporan</button>
    <button onclick="logout()">Keluar</button>
  </section>

  <p id="adminMessage">Memuat dashboard...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>

</body>
</html>
